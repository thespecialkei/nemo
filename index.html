    <script>
        // 텍스트 상자 크기가 바뀔 때마다 위쪽 제목 폭을 같이 맞춰주는 함수
        function syncTitleWidthToBox(titleEl, boxEl) {
            const ro = new ResizeObserver(entries => {
                for (const entry of entries) {
                    const width = entry.borderBoxSize
                        ? entry.borderBoxSize[0].inlineSize
                        : entry.contentRect.width;
                    titleEl.style.width = width + 'px';
                }
            });
            ro.observe(boxEl, { box: 'border-box' });
        }

        syncTitleWidthToBox(document.getElementById('bufferTitle'), document.getElementById('bufferBox'));
        syncTitleWidthToBox(document.getElementById('title1'), document.getElementById('box1'));
        syncTitleWidthToBox(document.getElementById('title2'), document.getElementById('box2'));
        syncTitleWidthToBox(document.getElementById('title3'), document.getElementById('box3'));
        syncTitleWidthToBox(document.getElementById('title4'), document.getElementById('box4'));
        syncTitleWidthToBox(document.getElementById('title5'), document.getElementById('box5'));
        syncTitleWidthToBox(document.getElementById('title6'), document.getElementById('box6'));
        syncTitleWidthToBox(document.getElementById('title7'), document.getElementById('box7'));

        syncTitleWidthToBox(document.getElementById('title9'), document.getElementById('box9'));
        syncTitleWidthToBox(document.getElementById('title10'), document.getElementById('box10'));
